name: Feature request
description: Suggest a focused site or simulator improvement.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What business or user problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the smallest useful version.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - Users can...
        - The simulator shows...
        - The page remains responsive...
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Hero
        - Metrics
        - Simulator
        - Contact form
        - Content
        - Documentation
        - Tooling
